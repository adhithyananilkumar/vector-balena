name: Vector server

on:
  push:
    paths:
      - 'src/vector-server/**'
      - '.github/workflows/vector-server.yml'
  pull_request:
    paths:
      - 'src/vector-server/**'
      - '.github/workflows/vector-server.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: src/vector-server

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/vector-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the container image
        run: docker build -t vector-server .

  balena-os-api-integration:
    name: BalenaOS real API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/vector-server/package-lock.json
      - run: npm ci
      - name: Verify release assets and cache invalidation against ob-api
        run: npx tsx --test test/balenaOsSync.integration.test.ts
        env:
          BALENA_OS_INTEGRATION: '1'
